<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Entrar — ConectaJá</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="app-shell.css">
  <link rel="stylesheet" href="mobile-ui.css">
  <script>!function(){var t=localStorage.getItem('cj-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}();</script>
  <style>
    body { background: var(--color-white, #fff) !important; padding-top: 10px !important; }
    .login-wrap {
      min-height: 100vh; display: flex; flex-direction: column;
      padding: 0 24px 40px;
    }
    .login-header { padding: 28px 0 32px; }
    .login-logo { font-family: 'Poppins',sans-serif; font-size: 28px; font-weight: 800; color: #FF6B35; margin-bottom: 24px; display: block; }
    .login-logo span { color: #00B4D8; }
    .login-title { font-family: 'Poppins',sans-serif; font-size: 24px; font-weight: 800; color: #111; margin-bottom: 6px; }
    .login-sub { font-size: 14px; color: #6b7280; line-height: 1.5; }
    .lbl { display: block; font-size: 13px; font-weight: 600; color: #6b7280; margin-bottom: 6px; }
    .inp {
      width: 100%; padding: 13px 16px; border: 1.5px solid #e5e7eb;
      border-radius: 12px; font-size: 15px; color: #111;
      background: #fff; outline: none; font-family: 'Inter',sans-serif;
      transition: border-color .2s, box-shadow .2s;
    }
    .inp:focus { border-color: #FF6B35; box-shadow: 0 0 0 3px #fff0eb; }
    .inp-wrap { position: relative; }
    .inp-wrap .inp { padding-right: 48px; }
    .eye-btn { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:#9ca3af; cursor:pointer; padding:4px; }
    .ig { margin-bottom: 16px; }
    .forgot { display:block; text-align:right; font-size:13px; color:#FF6B35; font-weight:600; text-decoration:none; margin-top:-8px; margin-bottom:20px; }
    .btn-main {
      width:100%; padding:14px; background:#FF6B35; color:#fff;
      border:none; border-radius:12px; font-size:15px; font-weight:700;
      font-family:'Poppins',sans-serif; cursor:pointer;
      transition: background .2s, transform .15s;
    }
    .btn-main:active { background:#e55a26; transform:scale(0.98); }
    .btn-main:disabled { opacity:.65; pointer-events:none; }
    .divider { display:flex; align-items:center; gap:12px; color:#9ca3af; font-size:13px; margin:20px 0; }
    .divider::before,.divider::after { content:''; flex:1; height:1px; background:#e5e7eb; }
    .btn-google {
      width:100%; padding:13px; background:#fff; border:1.5px solid #e5e7eb;
      border-radius:12px; font-size:14px; font-weight:600; color:#111;
      font-family:'Inter',sans-serif; cursor:pointer; display:flex; align-items:center;
      justify-content:center; gap:10px; transition: background .2s;
    }
    .btn-google:active { background:#f8f9fa; }
    .footer-link { margin-top:28px; text-align:center; font-size:14px; color:#6b7280; }
    .footer-link a { color:#FF6B35; font-weight:600; text-decoration:none; }
    .err-msg { background:#fee2e2; color:#b91c1c; padding:10px 14px; border-radius:10px; font-size:13px; font-weight:500; margin-bottom:16px; display:none; }
    .err-msg.show { display:block; }
  </style>
</head>
<body>

<!-- Status bar via app-shell -->
<div class="login-wrap">
  <div class="login-header">
    <a href="index.html" class="login-logo">Conecta<span>Já</span></a>
    <div class="login-title">Bem-vindo de volta</div>
    <div class="login-sub">Inicia sessão para acederes à tua conta.</div>
  </div>

  <div id="err-msg" class="err-msg"></div>

  <div class="ig">
    <label class="lbl">Email</label>
    <input class="inp" type="email" id="email" placeholder="o.teu@email.com" autocomplete="email" inputmode="email">
  </div>

  <div class="ig">
    <label class="lbl">Senha</label>
    <div class="inp-wrap">
      <input class="inp" type="password" id="password" placeholder="A tua senha" autocomplete="current-password">
      <button class="eye-btn" type="button" onclick="togglePwd()" aria-label="Mostrar senha">
        <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>

  <a href="#" class="forgot" onclick="forgotPwd(event)">Esqueceste a senha?</a>

  <button class="btn-main" id="login-btn" onclick="doLogin()">Entrar</button>

  <div class="divider">ou</div>

  <button class="btn-google" onclick="googleLogin()">
    <svg viewBox="0 0 24 24" width="20" height="20">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continuar com Google
  </button>

  <div class="footer-link">
    Não tens conta? <a href="register.html">Criar conta</a>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  // After login, go back to the page the user was trying to reach
  var redirect = sessionStorage.getItem('cj-redirect') || 'index.html';

  function togglePwd() {
    var inp = document.getElementById('password');
    var icon = document.getElementById('eye-icon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      inp.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }

  function showErr(msg) {
    var el = document.getElementById('err-msg');
    el.textContent = msg; el.classList.add('show');
  }
  function clearErr() {
    document.getElementById('err-msg').classList.remove('show');
  }

  async function doLogin() {
    clearErr();
    var email = document.getElementById('email').value.trim();
    var pass  = document.getElementById('password').value;
    if (!email || !pass) { showErr('Preenche o email e a senha.'); return; }
    var btn = document.getElementById('login-btn');
    btn.textContent = 'A entrar...'; btn.disabled = true;
    try {
      await firebase.auth().signInWithEmailAndPassword(email, pass);
      sessionStorage.removeItem('cj-redirect');
      window.location.href = redirect;
    } catch(e) {
      btn.textContent = 'Entrar'; btn.disabled = false;
      var msg = 'Email ou senha incorrectos.';
      if (e.code === 'auth/user-not-found') msg = 'Conta não encontrada.';
      if (e.code === 'auth/wrong-password')  msg = 'Senha incorrecta.';
      if (e.code === 'auth/too-many-requests') msg = 'Demasiadas tentativas. Tenta mais tarde.';
      showErr(msg);
    }
  }

  function googleLogin() {
    clearErr();
    var btn = document.querySelector('.btn-google');
    if (btn) { btn.disabled = true; btn.innerHTML = btn.innerHTML.replace('Continuar com Google', 'A redirecionar...'); }

    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    // Usar redirect (funciona em WebView/Median.co e em browsers normais)
    firebase.auth().signInWithRedirect(provider).catch(function(e) {
      if (btn) { btn.disabled = false; btn.innerHTML = btn.innerHTML.replace('A redirecionar...', 'Continuar com Google'); }
      showErr('Não foi possível iniciar o login com Google.');
    });
  }

  // Processar resultado do redirect Google ao voltar à página
  firebase.auth().getRedirectResult().then(function(result) {
    if (result && result.user) {
      sessionStorage.removeItem('cj-redirect');
      window.location.href = redirect;
    }
  }).catch(function(e) {
    if (e && e.code !== 'auth/no-current-user') {
      showErr('Erro no login com Google. Tenta novamente.');
    }
  });

  function forgotPwd(e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    if (!email) { showErr('Introduz o teu email primeiro.'); return; }
    firebase.auth().sendPasswordResetEmail(email)
      .then(function() { clearErr(); alert('Email de recuperação enviado para ' + email); })
      .catch(function() { showErr('Erro ao enviar email. Verifica o endereço.'); });
  }

  document.getElementById('password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });

  // If already logged in, redirect
  firebase.auth().onAuthStateChanged(function(user) {
    if (user) {
      sessionStorage.removeItem('cj-redirect');
      window.location.href = redirect;
    }
  });
</script>
<!-- App shell (status bar only, no bottom tabs on login) -->
<script>
(function(){
  var sb = document.createElement('div');
  sb.id = 'cj-status-bar';
  sb.style.cssText = 'position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:44px;background:#fff;z-index:9000;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #f0f0f0;';
  sb.innerHTML = '<span style="font-family:Inter,sans-serif;font-size:14px;font-weight:700;color:#111;">' +
    new Date().toLocaleTimeString('pt',{hour:'2-digit',minute:'2-digit'}) + '</span>' +
    '<div style="display:flex;gap:6px;color:#111;">' +
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M1.5 8.5a13 13 0 0121 0M5 12a10 10 0 0114 0M8.5 15.5a6 6 0 017 0M12 19h.01"/></svg>' +
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="7" width="20" height="11" rx="2"/><path d="M23 11v2"/></svg>' +
    '</div>';
  document.body.prepend(sb);
})();
</script>
</body>
</html>
